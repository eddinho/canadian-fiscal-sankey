[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canadian-fiscal-sankey"
version = "0.2.0"
description = "Interactive Sankey diagrams visualizing Canadian federal and Québec provincial government finances"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Canadian Fiscal Sankey Contributors" }
]
keywords = [
    "fiscal",
    "sankey",
    "visualization",
    "canada",
    "quebec",
    "government",
    "finances"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.0.0",
    "requests>=2.25.0",
    "plotly>=5.0.0",
    "PyPDF2>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/canadian-fiscal-sankey"
Documentation = "https://github.com/yourusername/canadian-fiscal-sankey#readme"
Repository = "https://github.com/yourusername/canadian-fiscal-sankey.git"
Issues = "https://github.com/yourusername/canadian-fiscal-sankey/issues"

[project.scripts]
canadian-fiscal-sankey = "canadian_fiscal_sankey.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
